name: CI/CD - Build, Push, Deploy

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  pr-validate:
    name: "Pull Request: Test & Verify Docker Build"
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # This job never authenticates to Azure, so it gets no id-token - just
    # enough to read the checked-out code.
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest -v

      # Verifies the Dockerfile still builds successfully. Not pushed
      # anywhere, and no Azure credentials are used or needed for this.
      - name: Build Docker image (verification only, no push)
        run: docker build -t app-demo:pr-verify .

  build-and-push:
    name: "Push to main: Build, Scan, Push to ACR"
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # Required at the CALLER too: a reusable workflow can never elevate
    # permissions beyond what the calling job itself was granted, so
    # id-token: write must be declared here as well as inside the
    # reusable workflow's own job.
    permissions:
      contents: read
      id-token: write
    uses: arek-devops-platform/platform-workflows/.github/workflows/docker-build-push.yml@main
    with:
      acr-name: ${{ vars.ACR_NAME }}
      image-name: app-demo
      azure-client-id: ${{ vars.AZURE_CLIENT_ID }}
      azure-tenant-id: ${{ vars.AZURE_TENANT_ID }}
      azure-subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

  deploy-dev:
    name: "Push to main: Deploy to DEV"
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-and-push
    permissions:
      contents: read
      id-token: write
    uses: arek-devops-platform/platform-workflows/.github/workflows/helm-deploy.yml@main
    with:
      environment-name: dev
      namespace: dev
      chart-path: helm/app-demo
      values-file: helm/app-demo/values-dev.yaml
      image-repository: ${{ vars.ACR_NAME }}.azurecr.io/app-demo
      image-tag: ${{ needs.build-and-push.outputs.image-tag }}
      aks-resource-group: ${{ vars.AKS_RESOURCE_GROUP }}
      aks-cluster-name: ${{ vars.AKS_CLUSTER_NAME }}
      azure-client-id: ${{ vars.AZURE_CLIENT_ID }}
      azure-tenant-id: ${{ vars.AZURE_TENANT_ID }}
      azure-subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

  smoke-test:
    name: "Push to main: Smoke Test DEV"
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: deploy-dev
    permissions:
      contents: read
      id-token: write
    uses: arek-devops-platform/platform-workflows/.github/workflows/smoke-test.yml@main
    with:
      namespace: dev
      aks-resource-group: ${{ vars.AKS_RESOURCE_GROUP }}
      aks-cluster-name: ${{ vars.AKS_CLUSTER_NAME }}
      azure-client-id: ${{ vars.AZURE_CLIENT_ID }}
      azure-tenant-id: ${{ vars.AZURE_TENANT_ID }}
      azure-subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

  deploy-prod:
    name: "Push to main: Deploy to PROD"
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # build-and-push must be listed explicitly (not just smoke-test) -
    # its output is only readable here because it's named in this list,
    # regardless of it already having finished transitively.
    needs: [smoke-test, build-and-push]
    permissions:
      contents: read
      id-token: write
    uses: arek-devops-platform/platform-workflows/.github/workflows/helm-deploy.yml@main
    with:
      environment-name: prod
      namespace: prod
      chart-path: helm/app-demo
      values-file: helm/app-demo/values-prod.yaml
      image-repository: ${{ vars.ACR_NAME }}.azurecr.io/app-demo
      # Same expression, same source job, as deploy-dev above - this is
      # what makes Build Once, Promote Many an enforced property of the
      # job graph rather than a hoped-for convention.
      image-tag: ${{ needs.build-and-push.outputs.image-tag }}
      aks-resource-group: ${{ vars.AKS_RESOURCE_GROUP }}
      aks-cluster-name: ${{ vars.AKS_CLUSTER_NAME }}
      azure-client-id: ${{ vars.AZURE_CLIENT_ID }}
      azure-tenant-id: ${{ vars.AZURE_TENANT_ID }}
      azure-subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
